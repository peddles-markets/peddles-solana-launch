[package]
name = "peddles-launch"
version = "0.1.0"
description = "Peddles launch program: coin, Meteora DAMM v2 pool, locked position and the fee split"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "peddles_launch"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# The `solana-v3` cohort is Anchor's default; it is left on so these crates stay on the path Anchor's
# own test suite runs. See README.md, "Versions".
anchor-lang = { version = "=1.2.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.2.2" }
peddles-fees = { path = "../../crates/peddles-fees" }
# `anchor_lang::solana_program` has no hash module in 1.2.2. This is the SHA-256 syscall.
solana-sha256-hasher = "=3.1.0"
solana-security-txt = "=1.1.3"

[lints.rust]
unexpected_cfgs = { level = "allow" }
